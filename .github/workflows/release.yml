name: Release builds

on:
  workflow_dispatch:
    inputs:
      upload_to_draft:
        description: Upload to the existing draft release for this exact version/tag
        type: boolean
        default: false
  # Exercise changes to the release machinery without creating a release/tag.
  push:
    branches: [0.14.0-dev, main]
    paths: ['.github/workflows/release.yml', 'tools/release/**', 'tests/test_hosted_release.py']
  pull_request:
    paths: ['.github/workflows/release.yml', 'tools/release/**', 'tests/test_hosted_release.py']

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '3'
  RUSTC_WRAPPER: ''

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Release safety regression tests
        run: python3 -m unittest discover -s tests -p test_hosted_release.py -v
      - name: Check version and release tag
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_TO_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_draft }}
        run: python3 tools/release/hosted.py preflight

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macOS-arm64
          - runner: windows-2022
            platform: Windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Mac dependencies
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install sdl3 pkg-config
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/release/windows-deps.ps1
      - name: Select pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustc -Vv
      - name: Formatting
        shell: bash
        run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: CPU regression tests
        shell: bash
        run: cargo test --locked --workspace
      - name: Build production executables
        shell: bash
        run: cargo build --locked --release --workspace --all-features
      - name: Package and verify native command-line tools
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python tools/release/hosted.py package
      - name: Preserve downloadable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: target/hosted-release/uploads/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  upload:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_draft
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: target/hosted-release/uploads
      - name: Verify artifacts and add them to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/hosted.py upload
