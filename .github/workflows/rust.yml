name: Rust verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-15
    # Full-map baking is an explicit desktop operation, outside hosted CI.
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require source-only map checkout
        run: |
          tracked_packages=$(git ls-files '*.placesmap')
          if [ -n "$tracked_packages" ]; then
            printf 'Compiled maps must remain untracked:\n%s\n' "$tracked_packages" >&2
            exit 1
          fi
      - name: Install native build dependencies
        run: brew install sdl3 pkg-config
      - name: Select repository toolchain
        run: rustup show active-toolchain
      - name: Prepare engine checkout without optional map content
        run: |
          mkdir -p "$RUNNER_TEMP/places-engine"
          git ls-files -z | python3 -c '
          import pathlib, shutil, sys
          destination = pathlib.Path(sys.argv[1])
          for raw in sys.stdin.buffer.read().split(b"\0"):
              if not raw:
                  continue
              source = pathlib.Path(raw.decode())
              if source.parts[0] in ("levels", "projects", "archive") or source.parts[:2] == ("assets", "levels") or source.suffix == ".placesmap":
                  continue
              target = destination / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          ' "$RUNNER_TEMP/places-engine"
      - name: Check Rust formatting
        working-directory: ${{ runner.temp }}/places-engine
        run: cargo fmt --all --check
      # Authored quest regressions compile the maintained Luau source scripts.
      # Run test-aware gates in the full source checkout; no map is baked.
      # Production binaries below still build in the engine-only checkout.
      - name: Check Rust targets and features
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Clippy debug
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Essential CPU regressions
        run: cargo test --locked --workspace
      - name: Clippy release
        run: cargo clippy --locked --release --workspace --all-targets --all-features -- -D warnings
      - name: Build production executables
        working-directory: ${{ runner.temp }}/places-engine
        run: cargo build --locked --release --workspace --all-features
      - name: Install source-check dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/places-python"
          "$RUNNER_TEMP/places-python/bin/python3" -m pip install Pillow numpy
          echo "$RUNNER_TEMP/places-python/bin" >> "$GITHUB_PATH"
      - name: Validate authored release sources and production Luau without baking
        run: python3 release/verify_desktop.py source --compiler "$RUNNER_TEMP/places-engine/target/release/places-map-compiler"
      - name: Verify the shipped audio bank without importing or rendering
        run: python3 assets/inspection/audio.py --check
      - name: Test source Python contracts
        env:
          PLACES_SKIP_SMOKE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s projects/environments/tests -p 'test_*.py'
      - name: Check patch whitespace
        run: git diff --check
