name: Rust verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-15
    # Full-map baking is an explicit desktop operation, outside hosted CI.
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false
      - name: Require source-only map checkout
        run: |
          tracked_packages=$(git ls-files '*.placesmap')
          if [ -n "$tracked_packages" ]; then
            printf 'Compiled maps must remain untracked:\n%s\n' "$tracked_packages" >&2
            exit 1
          fi
      - name: Install native build dependencies
        run: brew install sdl3 pkg-config
      - name: Select repository toolchain
        run: rustup show active-toolchain
      - name: Prepare engine checkout without optional map content
        run: |
          mkdir -p "$RUNNER_TEMP/places-engine"
          git ls-files -z | python3 -c '
          import pathlib, shutil, sys
          destination = pathlib.Path(sys.argv[1])
          for raw in sys.stdin.buffer.read().split(b"\0"):
              if not raw:
                  continue
              source = pathlib.Path(raw.decode())
              if source.parts[0] == "levels" or source.parts[:2] == ("assets", "levels") or source.suffix == ".placesmap":
                  continue
              target = destination / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          ' "$RUNNER_TEMP/places-engine"
      - name: Check Rust formatting
        working-directory: ${{ runner.temp }}/places-engine
        run: sh tools/check-rust.sh format
      - name: Check Rust targets and features
        working-directory: ${{ runner.temp }}/places-engine
        run: sh tools/check-rust.sh check
      - name: Clippy debug
        working-directory: ${{ runner.temp }}/places-engine
        run: sh tools/check-rust.sh clippy
      - name: Clippy release
        working-directory: ${{ runner.temp }}/places-engine
        run: sh tools/check-rust.sh clippy-release
      - name: Build production executables
        working-directory: ${{ runner.temp }}/places-engine
        run: sh tools/check-rust.sh build
      - name: Install source-check dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/places-python"
          "$RUNNER_TEMP/places-python/bin/python3" -m pip install Pillow numpy
          echo "$RUNNER_TEMP/places-python/bin" >> "$GITHUB_PATH"
      - name: Check authored assets and generators
        run: |
          python3 tools/assets/validate.py
          python3 tools/props/build.py --check
          python3 tools/entities/author_halloween_assets.py --check --glb sheet-ghost --glb sheet-ghost-cat
          python3 tools/entities/check_clip_boundaries.py
          python3 tools/levels/build_outdoor_fixture.py --check
          python3 tools/levels/build_lantern_hollow.py --check
          python3 tools/levels/build_lighting_quality.py --check
          python3 tools/levels/build_winter.py --check
          python3 tools/levels/build_beach.py --check
          python3 tools/levels/build_frutiger_aero.py --check
          python3 tools/textures/frutiger_aero_art.py --check
          python3 tools/levels/build_retro_arcade.py --check
          python3 tools/levels/build_office.py --check
          python3 tools/props/build_cockroach.py --check
          python3 tools/entities/build_mannequin.py --check-run-arms-forward
          python3 tools/textures/author_arcade.py --check
          python3 tools/levels/build_capacity_fixtures.py --check
      - name: Test source Python contracts
        env:
          PLACES_SKIP_SMOKE: '1'
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check patch whitespace
        run: git diff --check
