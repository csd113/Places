# Required transitive major/minor splits: PNG uses miniz_oxide 0.8 directly while
# flate2 uses 0.9. The wgpu tree adds two more: zerocopy-derive (via half and
# naga) uses syn 2 while bytemuck_derive, serde_derive and thiserror-impl use
# syn 3, and wgpu-hal's hashbrown 0.17 cannot be unified with the 0.16 that
# gpu-allocator selects on the Vulkan/D3D12 targets. None can be unified without
# changing upstream dependencies. Keep every other duplicate diagnostic.
allowed-duplicate-crates = ["hashbrown", "miniz_oxide", "syn"]
