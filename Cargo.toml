[package]
name = "liminal-rust"
version = "0.5.2"
edition = "2024"
rust-version = "1.91"
description = "First-person liminal walking game"
license = "MIT"
repository = "https://github.com/csd113/Places"
publish = false

[dependencies]
glam = "0.29"
glow = "0.16"
png = "0.18.1"
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
