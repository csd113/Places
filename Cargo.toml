[package]
name = "places"
version = "0.12.0"
edition = "2024"
rust-version = "1.99"
description = "Places: a slow first-person exploration experience"
license = "MIT"
repository = "https://github.com/csd113/Places"
publish = false
# Optional authored maps and generated packages are external content, never
# required inputs to the engine/compiler crate or its source distribution.
exclude = ["levels/**", "assets/levels/**"]

# Explicit developer tool; retained from the former Cargo example.
[[bin]]
name = "package-repack"
path = "tools/rust/package_repack/main.rs"

[features]
# Development-only native diagnostic views; the normal build retains the exact
# production WGSL and does not carry the selector or diagnostic shader branch.
visual-diagnostics = ["wgpu/counters"]
# Opt-in physics solver experiment; production policy follows measured workloads.
parallel-physics = ["rapier3d/parallel"]

[dependencies]
# Safe zero-copy bytes for the small plain-data GPU structs (world vertex,
# camera uniform). Already a transitive wgpu dependency; the derive feature
# makes the layout contract explicit without unsafe transmutation.
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
# Compiler-only terminal sizing and cooperative Ctrl-C handling; no UI runtime.
ctrlc = "3.5.2"
terminal_size = "0.4.4"
glam = "0.34.1"
# Maintained pure-Rust rigid bodies (native and future WASM); the player keeps
# its established controller and shares the same metre/second gravity value.
rapier3d = "0.36.1"
png = "0.18.1"
# Blocking adapter/device initialization for the wgpu backend: two futures and
# no async runtime.
pollster = "1.0.1"
# SDL3 window/input platform layer. sdl3-sys probes pkg-config by default
# (Homebrew: `brew install sdl3`); `raw-window-handle` 0.6 is the same version
# wgpu 30 uses and provides HasWindowHandle/HasDisplayHandle for the window. No
# other SDL3 features are enabled. The player renders through wgpu; the small
# compiler GUI uses SDL's 2D renderer. Neither uses SDL's GPU API.
sdl3 = { version = "0.20.0", features = ["use-pkg-config", "raw-window-handle"] }
serde = { version = "1.0.229", features = ["derive"] }
# Raw editor JSON must reread its own floating-point serialization exactly.
# The default fast parser can round the last decimal digit differently.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# Package integrity: content-addressed blob names and dependency identities.
# Pure Rust, no C toolchain and no runtime services; used by both the offline
# compiler and the player's package reader.
sha2 = "0.11.1"
# wgpu renderer: device, surface, world geometry and every later pass. Only
# the native desktop backend of each target is compiled: Metal on macOS,
# Vulkan on Linux, Direct3D 12 on Windows. The GLES, WebGPU and WebGL backends
# stay off; `render::wgpu` never falls back to GL. `wgsl` is the shader
# language the world, decal, post and UI pipelines use.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Shared sandboxed Luau, statically built; no JIT, FFI or module loader.
mlua = { version = "0.12.2", default-features = false, features = ["luau", "vendored", "send"] }

[build-dependencies]
sha2 = "0.11.1"

# One bounded persistent CPU executor for independent runtime preparation.
# Browser builds retain the identical serial work without native threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"
# Static, preloaded WAV playback; the browser target uses the engine's silent
# backend. No streaming decoder or general-purpose async runtime is enabled.
kira = { version = "0.12.5", default-features = false, features = ["wav", "pcm"] }
# Kira already uses this bounded SPSC queue; the optional developer PCM tap
# shares it and never blocks or writes files on the audio callback.
rtrb = "0.4.0"

[target.'cfg(unix)'.dependencies]
# Atomic directory recovery must refuse a destination created by another process.
libc = "0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "wgsl"] }

[lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
unused_results = "deny"
unsafe_op_in_unsafe_fn = "deny"

# Rust 1.99.1 is pinned in rust-toolchain.toml. Keep the policy here so check,
# Clippy and the desktop verification gate agree without duplicating flags.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
todo             = "deny"
unimplemented    = "deny"
unreachable      = "warn"
indexing_slicing = "deny"
string_slice = "deny"
unwrap_in_result = "warn"
exit             = "deny"
mem_forget       = "deny"

arithmetic_side_effects = "deny"
default_numeric_fallback = "deny"
lossy_float_literal = "deny"
as_conversions = "deny"
cast_possible_truncation = "warn"
cast_sign_loss            = "warn"
cast_precision_loss       = "warn"
cast_possible_wrap        = "warn"
float_cmp                 = "warn"

dbg_macro    = "deny"
print_stdout = "warn"
print_stderr = "warn"

large_enum_variant = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
redundant_clone            = "warn"
needless_pass_by_value     = "warn"
trivially_copy_pass_by_ref = "warn"

missing_panics_doc                 = "warn"
missing_errors_doc                 = "warn"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "warn"

undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes_without_reason = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
rest_pattern_accessible_field = "deny"
shadow_unrelated = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
missing_assert_message = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Luau reports ordinary VM errors with C++ exceptions through mlua's
# C-unwind callbacks. Abort mode terminates at that foreign-unwind boundary.
panic = "unwind"

# Keep offline preparation and numerical developer tools usable in debug builds.
# The player loads solved packages; it never fills a lightmap atlas at startup.
# Historical source-preparation measurements found opt-level = 0 dominated by
# numeric atlas loops. Level 1 retains debug information and assertions; release
# remains the performance reference for deliberate map/compiler campaigns.
[profile.dev]
opt-level = 1

# Explicit developer operation probe; never runs as part of tests or CI.
[[bin]]
name = "editor-profile"
path = "tools/rust/editor-profile/main.rs"

# Explicit legacy migration and diagnostics, never a map-baking CI test.
[[bin]]
name = "environment-import-audit"
path = "tools/rust/environment-import-audit/main.rs"
